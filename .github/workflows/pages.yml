# Publishes the DEMO site (sample data) to GitHub Pages whenever the `demo` branch is updated, and every 6 hours so the
# demo's market prices stay current. `main` is the working app and never publishes. To refresh the showcase, merge main
# into demo (one way only).
#
# Market prices: the repository secret FCS_API_KEY (Settings -> Secrets and variables -> Actions) is used only at build
# time to write a price snapshot; it is never placed in the site. Without the secret the demo shows "Prices unavailable".
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [demo]
  schedule:
    - cron: '17 */6 * * *'   # scheduled runs always use the default branch's copy of this file, so the job checks out `demo` itself
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test           # unit tests must pass before anything is published
      - name: Price snapshot for the demo ticker
        run: node scripts/fetch-ticker-snapshot.mjs
        env:
          FCS_API_KEY: ${{ secrets.FCS_API_KEY }}
      - run: npm run build:demo # demo mode: sample data, no saving (see .env.demo); includes the snapshot above
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
