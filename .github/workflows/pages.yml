# Publishes the DEMO site (sample data) to GitHub Pages whenever the `demo` branch is updated. `main` is the working app and never publishes. To refresh the showcase, merge main
# into demo (one way only).
#
# Market prices: the demo's page asks FCS API for a 24-hour token using only the PUBLIC key in .env.demo (VITE_FCS_PUBLIC_KEY).
# The site's domain must be listed in the FCS dashboard (Security -> Allowed Domains). No secret key is used anywhere.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test           # unit tests must pass before anything is published
      - run: npm run build:demo # demo mode: sample data, no saving, public market-data key (see .env.demo)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo
      - id: deployment
        uses: actions/deploy-pages@v4
