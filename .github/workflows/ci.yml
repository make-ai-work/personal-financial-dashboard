# Tests and builds the working app (and the demo build) on every pull request and push to main. Does not publish anything.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'   # the web builds do not need the Windows app's Electron binary
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
